# Default values for taskwave-backend

# Image configuration
image:
  repository: taskwave-backend
  tag: latest
  pullPolicy: Never  # Use Never for Minikube local images

# Replica configuration
replicaCount: 2

# Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Health probes
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

# ConfigMap values (non-sensitive)
config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8000"

# Secret reference (use existing secret)
existingSecret: "taskwave-secrets"

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
