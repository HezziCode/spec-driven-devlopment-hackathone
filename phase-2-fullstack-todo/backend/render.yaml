# Render Blueprint for TaskWave Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: taskwave-api
    runtime: python
    region: oregon  # or singapore, frankfurt, ohio
    plan: free      # free, starter, standard, pro
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in dashboard
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
