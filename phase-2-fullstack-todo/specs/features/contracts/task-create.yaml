openapi: 3.0.3
info:
  title: Task Creation API
  description: API contract for creating new tasks in the todo application
  version: 1.0.0
servers:
  - url: https://api.example.com/api/v1
    description: Production server
  - url: https://staging-api.example.com/api/v1
    description: Staging server
paths:
  /users/{user_id}/tasks:
    post:
      summary: Create a new task for a user
      description: Creates a new task associated with the specified user. The authenticated user must match the user_id in the path.
      operationId: createTask
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the user creating the task
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - user does not have permission to create task for this user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TaskCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: The title of the task
          minLength: 1
          maxLength: 200
          example: "Buy groceries"
        description:
          type: string
          description: Detailed description of the task
          maxLength: 1000
          example: "Milk, bread, eggs, and fruit"
        priority:
          type: string
          description: Priority level of the task
          enum: [low, medium, high, critical]
          default: medium
          example: "high"
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 10
          description: Tags associated with the task
          example: ["shopping", "urgent"]
    TaskResponse:
      type: object
      required:
        - id
        - title
        - description
        - completed
        - priority
        - tags
        - user_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the task
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: The title of the task
          example: "Buy groceries"
        description:
          type: string
          description: Detailed description of the task
          example: "Milk, bread, eggs, and fruit"
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        priority:
          type: string
          description: Priority level of the task
          enum: [low, medium, high, critical]
          example: "high"
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the task
          example: ["shopping", "urgent"]
        user_id:
          type: string
          format: uuid
          description: ID of the user who owns the task
          example: "123e4567-e89b-12d3-a456-426614174001"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: "2023-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: "2023-01-01T12:00:00Z"
    ErrorResponse:
      type: object
      required:
        - error
        - code
        - timestamp
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Invalid input data"
        code:
          type: string
          description: Machine-readable error code
          example: "INVALID_INPUT"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred
          example: "2023-01-01T12:00:00Z"